name: Hosted Sandbox Deploy

on:
  workflow_dispatch:
    inputs:
      migration_fingerprint:
        description: Required 64-char migration fingerprint gate
        required: true
        type: string
      commit_sha:
        description: Optional commit SHA to deploy (defaults to checkout HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy-gate:
    name: Artifact-gated dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hosted-sandbox-deploy
    env:
      MANU_CI_NO_PRODUCTION_EFFECTS: "true"
      MANU_EXPECTED_MIGRATION_FINGERPRINT: ${{ inputs.migration_fingerprint }}
      MANU_RELEASE_ARTIFACT_REQUIRED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install hosted sandbox workflows
        run: node tools/hosted-sandbox/deploy/install-workflows.mjs

      - name: Verify workflow hardening
        run: node tools/hosted-sandbox/deploy/verify-workflow-hardening.mjs

      - name: Production build
        working-directory: app
        run: npm run build

      - name: Build release artifact manifest
        run: node tools/hosted-sandbox/deploy/build-release-artifact.mjs

      - name: Dry-run atomic deploy
        run: node tools/hosted-sandbox/deploy/deploy-hosted-release.mjs
